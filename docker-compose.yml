x-service-env: &service-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: postgres
  DB_PASSWORD: password
  DB_NAME: smartcourse_db
  ENV: dev
  SKIP_LIQUIBASE: "true"
  USER_SERVICE_PORT: "8081"
  COURSE_SERVICE_PORT: "8082"
  ENROLLMENT_SERVICE_PORT: "8083"

services:
  postgres:
    image: postgres:15
    container_name: smartcourse-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: smartcourse_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # One-shot: applies the Liquibase changelogs, then exits. Services wait for it.
  liquibase:
    build: ./smartcourse/liquibase
    volumes:
      - ./smartcourse/migrations:/liquibase/changelog
    command:
      - --changelog-file=db.changelog-master.yaml
      - --url=jdbc:postgresql://postgres:5432/smartcourse_db
      - --username=postgres
      - --password=password
      - update
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  user-service:
    build:
      context: ./smartcourse
      dockerfile: services/user-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      <<: *service-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@smartcourse.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-password-123}
    depends_on:
      postgres:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully

  course-service:
    build:
      context: ./smartcourse
      dockerfile: services/course-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      <<: *service-env
    depends_on:
      postgres:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
      user-service:
        condition: service_started

  enrollment-service:
    build:
      context: ./smartcourse
      dockerfile: services/enrollment-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      <<: *service-env
    depends_on:
      postgres:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
      course-service:
        condition: service_started

  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233"

volumes:
  postgres_data:
