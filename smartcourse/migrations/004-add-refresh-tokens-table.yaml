databaseChangeLog:
  - changeSet:
      id: 004-add-refresh-tokens-table
      author: smartcourse
      changes:
        - createTable:
            schemaName: user_service
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: token_hash
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: family_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: revoked_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            schemaName: user_service
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_user_family
            columns:
              - column:
                  name: user_id
              - column:
                  name: family_id
