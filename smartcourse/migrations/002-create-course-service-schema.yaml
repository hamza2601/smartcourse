databaseChangeLog:
  - changeSet:
      id: 002-create-course-service-schema
      author: smartcourse
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS course_service
        - createTable:
            schemaName: course_service
            tableName: courses
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: instructor_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: draft
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createTable:
            schemaName: course_service
            tableName: progress
            columns:
              - column:
                  name: student_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: course_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: completed_lessons
                  type: INT
                  defaultValue: 0
                  constraints:
                    nullable: false
              - column:
                  name: last_accessed
                  type: TIMESTAMP
        - addPrimaryKey:
            schemaName: course_service
            tableName: progress
            columnNames: student_id, course_id
            constraintName: pk_progress
        - createTable:
            schemaName: course_service
            tableName: outbox_events
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: processed_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
