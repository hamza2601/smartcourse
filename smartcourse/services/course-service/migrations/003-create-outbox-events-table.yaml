databaseChangeLog:
  - changeSet:
      id: 003-create-outbox-events-table
      author: smartcourse
      changes:
        - createTable:
            schemaName: course_service
            tableName: outbox_events
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: aggregate_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: aggregate_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: processed_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true
        # The relay only ever scans unprocessed rows in created_at order.
        - sql:
            sql: >
              CREATE INDEX idx_outbox_events_unprocessed
              ON course_service.outbox_events (created_at)
              WHERE processed_at IS NULL
