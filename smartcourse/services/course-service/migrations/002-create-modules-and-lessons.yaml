databaseChangeLog:
  - changeSet:
      id: 002-create-modules-and-lessons
      author: smartcourse
      changes:
        - createTable:
            schemaName: course_service
            tableName: modules
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: course_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: position
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_modules_course
            baseTableSchemaName: course_service
            baseTableName: modules
            baseColumnNames: course_id
            referencedTableSchemaName: course_service
            referencedTableName: courses
            referencedColumnNames: id
            onDelete: CASCADE
        - addUniqueConstraint:
            constraintName: uq_modules_course_position
            schemaName: course_service
            tableName: modules
            columnNames: course_id, position

        - createTable:
            schemaName: course_service
            tableName: lessons
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: module_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: TEXT
                  defaultValueComputed: "''"
                  constraints:
                    nullable: false
              - column:
                  name: position
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_lessons_module
            baseTableSchemaName: course_service
            baseTableName: lessons
            baseColumnNames: module_id
            referencedTableSchemaName: course_service
            referencedTableName: modules
            referencedColumnNames: id
            onDelete: CASCADE
        - addUniqueConstraint:
            constraintName: uq_lessons_module_position
            schemaName: course_service
            tableName: lessons
            columnNames: module_id, position
