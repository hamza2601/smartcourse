databaseChangeLog:
  - changeSet:
      id: 003-create-course-seats-table
      author: smartcourse
      changes:
        - createTable:
            schemaName: enrollment_service
            tableName: course_seats
            columns:
              # Course lives in course_service; plain UUID, no cross-schema foreign key.
              - column:
                  name: course_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              # Copied from the course's enrollment_limit; NULL means unlimited.
              - column:
                  name: capacity
                  type: INT
                  constraints:
                    nullable: true
              - column:
                  name: taken
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - sql:
            sql: >
              ALTER TABLE enrollment_service.course_seats
              ADD CONSTRAINT chk_course_seats_taken
              CHECK (taken >= 0 AND taken <= capacity)
